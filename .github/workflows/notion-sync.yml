name: Sync Notion to GitHub

on:
  schedule:
    - cron: "0 0 * * *" # 매일 한국시간 오전 9시(UTC 0시)에 실행
    # 이틀에 한 번으로 하고 싶으면 위 줄을 지우고 아래 줄 주석을 해제하세요
    # - cron: "0 0 */2 * *" # 홀수 날짜마다 실행 (2일 간격에 근접)
  workflow_dispatch: {} # Actions 탭에서 수동 실행 버튼으로 언제든 즉시 실행 가능

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: scripts/notion-sync
        run: npm install

      - name: Run Notion sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OUTPUT_DIR: study-notes
          README_PATH: README.md
        run: node scripts/notion-sync/index.js

      - name: Commit and push changes
        run: |
          git config user.name "notion-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study-notes README.md
          if git diff --cached --quiet; then
            echo "변경사항 없음, 커밋 생략"
          else
            git commit -m "chore: sync notion pages to markdown"
            git push
          fi
